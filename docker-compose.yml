services:
  db:
    image: postgres:17-alpine
    container_name: payrolldesk_db
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: payroll_dev
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./samples:/samples:ro  # Mount samples for restore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} — Payroll Desk</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/styles.min.css?v=4">
    <style>
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0f172a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 2rem;
            margin: 0;
        }
        .error-card {
            text-align: center;
            max-width: 460px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: .5rem;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: .75rem;
        }
        .error-message {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .error-actions {
            display: flex;
            gap: .75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-btn {
            display: inline-block;
            padding: .625rem 1.25rem;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            font-size: .875rem;
            transition: all .2s ease;
            cursor: pointer;
        }
        .error-btn--primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #fff;
            border: none;
        }
        .error-btn--primary:hover {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .error-btn--secondary {
            background: rgba(15, 23, 42, 0.6);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .error-btn--secondary:hover {
            border-color: rgba(148, 163, 184, 0.5);
            color: #f8fafc;
        }
    </style>
</head>
<body class="error-page">
    <div class="error-card">
        <div class="error-code">{{ status_code }}</div>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-message">{{ message }}</p>
        <div class="error-actions">
            <a href="/dashboard" class="error-btn error-btn--primary">Go to Dashboard</a>
            <a href="javascript:history.back()" class="error-btn error-btn--secondary">Go Back</a>
        </div>
    </div>
</body>
</html>

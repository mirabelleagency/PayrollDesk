services:
  postgres:
    image: postgres:17-alpine
    container_name: payrolldesk-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
